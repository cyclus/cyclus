[workspace]
name = "cyclus"
description = "Development environment for building and testing Cyclus"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# Build tools
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
cmake = ">=4.4.3,<5"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
# C++ library dependencies
libboost-devel = ">=1.92.0,<2"
coincbc = ">=2.10.13,<3"
glib = ">=2.90.0,<3"
hdf5 = ">=2.2.0,<3"
liblapack = ">=3.11.0,<4"
# The headers and pkg-config file of libxml2 are in libxml2-devel as of
# libxml2 2.14 on conda-forge, and are needed both by Cyclus itself and by
# libxml++-4.0.pc.
libxml2-devel = ">=2.15.4,<3"
# The headers and pkg-config file of libxml++ are in libxmlpp-devel as of
# build 4 of libxmlpp-4.0 on conda-forge, and libxmlpp-devel 5.x is libxml++-5.0.
libxmlpp-devel = ">=4.0.2,<5"
pcre = ">=8.45,<9"
sqlite = ">=3.53.4,<4"
# Python dependencies
python = ">=3.12.0,<3.16"
# Cyclus embeds the Python interpreter, so it links to the libpython shared
# library. As of Python 3.15 on conda-forge the python package no longer
# installs it, cf. https://conda-forge.org/blog/2026/09/03/python-315/
libpython = ">=3.12.0,<3.16"
cython = ">=3.1.0,<4"
jinja2 = ">=3.1.6,<4"
pandas = ">=3.0.6,<4"
pip = ">=26.2.1,<27"
pprintpp = ">=0.4.0,<0.5"
setuptools = ">=84.0.0,<85"
websockets = ">=17.2,<18"

[target.osx.dependencies]
# Clang does not ship an OpenMP runtime, which is needed for --parallel builds
llvm-openmp = ">=23.1.2,<24"

[target.osx.activation.env]
# The conda-forge clang packages do not provide cc, c++, or cpp, so without
# these CMake and cycpp.py would use the Xcode toolchain instead.
CC = "clang"
CXX = "clang++"
CPP = "clang-cpp"
# The shared libraries are linked with -flat_namespace, which makes the linker
# load the dependencies of the libraries being linked against. Some of those
# are referenced through @rpath (e.g. libquadmath from libgfortran) and are
# only found if the environment's library directory is searched.
LDFLAGS = "-L$CONDA_PREFIX/lib"

[activation.env]
# Cyclus is installed into the workspace's install/ directory, not into the
# Pixi environment, so that the environment only ever contains what is in
# pixi.lock. This does not make the build any more reproducible (pixi.lock
# already pins every dependency), but it keeps what Pixi manages separate from
# what the build produces:
# * No file collisions. Cyclus builds its own copy of GoogleTest (downloaded
#   with CMake's FetchContent in tests/CMakeLists.txt) and installs libgtest
#   and libgmock into <prefix>/lib, where they would overwrite, or be
#   overwritten by, the files of a gtest package if one were added to the
#   environment.
# * Clean uninstalls. Everything Cyclus installs is under install/, so
#   removing it ('pixi run uninstall') leaves nothing behind. In the Pixi
#   environment, files from an earlier build that a newer build no longer
#   installs would remain until the environment is recreated.
CYCLUS_INSTALL_PREFIX = "$PIXI_PROJECT_ROOT/install"
# The build directory is per Pixi environment, as CMake records the absolute
# paths of the compilers and of cmake itself in it at configure time, and so a
# build directory can only be reused from the environment that configured it.
# It has to be directly under the top level of the repository, as the build
# refers to the sources relative to it (e.g. ../cyclus/system.py in
# cli/sidecar.py).
CYCLUS_BUILD_DIR = "$PIXI_PROJECT_ROOT/build-$PIXI_ENVIRONMENT_NAME"
PATH = "$CYCLUS_INSTALL_PREFIX/bin:$PATH"
# Relocate the Python user site, which is where CMakeLists.txt installs the
# Cyclus Python package by default, from ~/.local to the install prefix.
PYTHONUSERBASE = "$CYCLUS_INSTALL_PREFIX"

[tasks.build]
# Extra arguments are forwarded to install.py, e.g.
#   pixi run build -j 4 --parallel --allow-milps
# install.py builds with a single job unless given -j, so default to using 80%
# of the CPUs of the machine. A -j given on the command line comes later in
# the arguments and so takes precedence.
# The user site has to exist before the install, as the install step that
# symlinks the Cython modules into it does not create it and its failure is
# not treated as an error.
cmd = """
mkdir -p "$(python -m site --user-site)" && \
python install.py --build-dir "$CYCLUS_BUILD_DIR" --prefix "$CYCLUS_INSTALL_PREFIX" \
-j "$(python -c "import os; print(max(1, int(os.cpu_count() * 0.8)))")"
"""
description = "Build Cyclus and install it into the workspace's install/ directory"

[tasks.uninstall]
# The build directory is kept, so 'pixi run build' only has to install again.
cmd = 'rm -rf "$CYCLUS_INSTALL_PREFIX"'
description = "Uninstall Cyclus by removing the workspace's install/ directory"

[feature.test.dependencies]
pytables = ">=3.11.1,<4"
pytest = ">=9.1.1,<10"

[feature.test.tasks.test-unit]
cmd = "cyclus_unit_tests"
description = "Run the C++ unit tests (requires 'pixi run build')"

[feature.test.tasks.test-python]
cmd = "pytest"
cwd = "tests"
description = "Run the Python tests (requires 'pixi run build')"

[feature.test.tasks.test]
depends-on = ["test-unit", "test-python"]
description = "Run all tests (requires 'pixi run build')"

[feature.test.tasks.start]
depends-on = ["uninstall", "build", "test"]
description = "Build and test Cyclus from a clean install"

[feature.minimum]
# The versions below have only been solved and tested for linux-64.
platforms = ["linux-64"]

# The minimum versions of the dependencies that DEPENDENCIES.rst documents
[feature.minimum.dependencies]
cmake = "3.16.3.*"
pkg-config = "0.29.1.*"
boost-cpp = "1.71.0.*"
libxml2 = "2.9.10.*"
libxmlpp = "2.40.1.*"
python = "3.10.0.*"
# Python 3.10 on conda-forge requires 3.36.0
sqlite = "3.36.0.*"
hdf5 = "1.10.4.*"
# The liblapack package is the LAPACK 3.9.0 interface of a build of OpenBLAS,
# and build 0 has the oldest OpenBLAS. The latest builds also install MKL,
# which the FindLAPACK module of CMake 3.16 uses in place of liblapack.
liblapack = { version = "3.9.0.*", build-number = "0" }
git = "2.32.0.*"
# Includes Coin-Clp 1.17.3
coincbc = "2.10.3.*"
# The oldest Cython on conda-forge for Python 3.10
cython = "0.29.24.*"
# Older versions cannot be imported with Python 3.10, as they use the
# collections.Mapping alias that Python 3.10 removed.
jinja2 = "2.10.3.*"
# The oldest NumPy on conda-forge that pandas 1.3.4 can be installed with
numpy = "1.21.4.*"
# The oldest pandas on conda-forge for Python 3.10
pandas = "1.3.4.*"
pip = "20.0.2.*"
# The same as in [dependencies]
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
# No documented minimum
make = "*"
pcre = "*"
pprintpp = "*"
pytest = "*"
setuptools = "*"
websockets = "*"

[feature.minimum.pypi-dependencies]
# conda-forge has no pytables that is built with HDF5 1.10 for Python 3.10.
# The wheels have their own copy of HDF5, which is only used to read the
# output files in the Python tests. 3.7.0 is the first with wheels for Python
# 3.10, and later versions need a newer NumPy.
tables = "==3.7.0"

[feature.minimum.activation.env]
# CMake 3.16 does not search the Pixi environment unless it is told to, and so
# finds the dependencies of the system instead.
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
# The same as in [activation.env], except for the install directory, so that
# the build of this environment is not installed over that of the others.
CYCLUS_INSTALL_PREFIX = "$PIXI_PROJECT_ROOT/install-minimum"
CYCLUS_BUILD_DIR = "$PIXI_PROJECT_ROOT/build-$PIXI_ENVIRONMENT_NAME"
PATH = "$CYCLUS_INSTALL_PREFIX/bin:$PATH"
PYTHONUSERBASE = "$CYCLUS_INSTALL_PREFIX"

[feature.minimum.tasks.build-minimum]
# The same as the build task, with --allow-milps for the build to use Coin-Cbc
# and Coin-Clp. Extra arguments are forwarded to install.py.
cmd = """
mkdir -p "$(python -m site --user-site)" && \
python install.py --build-dir "$CYCLUS_BUILD_DIR" --prefix "$CYCLUS_INSTALL_PREFIX" --allow-milps \
-j "$(python -c "import os; print(max(1, int(os.cpu_count() * 0.8)))")"
"""
description = "Build Cyclus with the minimum versions of its dependencies"

[feature.minimum.tasks.test-minimum]
cmd = "cyclus_unit_tests && pytest"
cwd = "tests"
description = "Run all tests (requires 'pixi run build-minimum')"

[environments]
# Both environments are in the same solve group so that they use the same
# versions of the dependencies they share. The default environment has to be
# listed for this, as it is not part of any solve group otherwise.
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
minimum = { features = ["minimum"], no-default-feature = true }
