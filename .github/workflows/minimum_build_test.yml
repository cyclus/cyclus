name: Minimum Dependencies Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pixi.toml"
      - ".github/workflows/minimum_build_test.yml"
  push:
    paths:
      - "pixi.toml"
      - ".github/workflows/minimum_build_test.yml"
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-minimum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          environments: minimum
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Build Cyclus
        run: pixi run build-minimum -j "$(nproc)"

      - name: Run tests
        run: pixi run test-minimum
