name: MacOS Build/Test Cyclus

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"
  push:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"

jobs:
  build-test-conda:
    strategy:
      fail-fast: false
      matrix:
        macos_versions: [
            macos-14,
            macos-15-intel,
            macos-latest, #macos 15 arm64
        ]
        parallel_flag : [
          "",
          "--parallel",
        ]
        coin_flag : [
          "",
          "--allow-milps",
        ]

    runs-on: ["${{ matrix.macos_versions }}"]

    steps:
      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Checkout Cyclus
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          miniforge-version: "latest"
          conda-solver: "libmamba"
          auto-update-conda: true
          channels: conda-forge

      - name: Build and Test Cyclus
        id: build-cyclus
        shell: bash -el {0}
        run: |
          # Keep the compiler versions from the successful July CI runs while
          # investigating Clang 21 incompatibilities with the Xcode linker.
          mamba install -y \
            "compilers=1.11.0" \
            "c-compiler=1.11.0" \
            "cxx-compiler=1.11.0" \
            "clang=19.1.7" \
            "clangxx=19.1.7" \
            cmake \
            make \
            git \
            glib \
            libxml2 \
            libxmlpp-4.0 \
            liblapack \
            pkg-config \
            coincbc \
            boost-cpp \
            hdf5 \
            sqlite \
            pcre \
            setuptools \
            pytest \
            pytables \
            pandas \
            jinja2 \
            "cython<3.1.0" \
            websockets \
            pprintpp \
            pip
          export CC=$CONDA_PREFIX/bin/clang
          export CXX=$CONDA_PREFIX/bin/clang++
          export CPP=$CONDA_PREFIX/bin/clang-cpp

          # Temporary diagnostics for the non-parallel libquadmath link failure.
          echo "::group::Fortran runtime libraries and dependency paths"
          find "$CONDA_PREFIX" \( -name 'libgfortran*.dylib' -o -name 'libquadmath*.dylib' \) -print
          for library in "$CONDA_PREFIX"/lib/libgfortran*.dylib "$CONDA_PREFIX"/lib/libquadmath*.dylib; do
            if [[ -e "$library" ]]; then
              echo "Library: $library"
              otool -L "$library" || echo "Could not inspect dependencies: $library"
              otool -l "$library" | sed -n '/cmd LC_RPATH/,+2p' || echo "Could not inspect RPATH: $library"
            fi
          done
          echo "::endgroup::"

          echo "::group::Clang linker commands with and without OpenMP (dry run)"
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/link-probe.cc"
          echo "Without OpenMP:"
          "$CXX" -### "$RUNNER_TEMP/link-probe.cc" -o "$RUNNER_TEMP/link-probe"
          echo "With OpenMP:"
          "$CXX" -### -fopenmp=libomp "$RUNNER_TEMP/link-probe.cc" -o "$RUNNER_TEMP/link-probe"
          echo "::endgroup::"

          # Print the actual compile and link commands, including failing ones.
          export VERBOSE=1
          export LDFLAGS="${LDFLAGS:+$LDFLAGS }-L${CONDA_PREFIX}/lib"
          mkdir -p $(python3 -m site --user-site)
          python3 install.py -j 3 ${{ matrix.parallel_flag }} ${{ matrix.coin_flag }}
          export PATH=$HOME/.local/bin:$PATH
          cyclus_unit_tests
          cd tests && python3 -m pytest
