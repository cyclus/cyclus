name: MacOS Build/Test Cyclus

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"
  push:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"

jobs:
  build-test-conda:
    strategy:
      fail-fast: false
      matrix:
        macos_versions: [
            macos-14,
            macos-15-intel,
            macos-latest, #macos 15 arm64
        ]
        parallel_flag : [
          "",
          "--parallel",
        ]
        coin_flag : [
          "",
          "--allow-milps",
        ]

    runs-on: ["${{ matrix.macos_versions }}"]

    steps:
      - name: Check temporary workaround deadline
        run: |
          # Revisit the compiler pins before November 1, 2026 (UTC).
          test "$(date -u +%Y%m%d)" -lt 20261101 || {
            echo "::error::Compiler workaround expired; review the pins and" \
              "delete L49-57 of macos_build_test.yml when a more stable fix" \
              "has been added."
            exit 1
          }

      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Checkout Cyclus
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          miniforge-version: "latest"
          conda-solver: "libmamba"
          auto-update-conda: true
          channels: conda-forge

      - name: Build and Test Cyclus
        id: build-cyclus
        shell: bash -el {0}
        run: |
          # Keep the compiler versions from the successful July CI runs while
          # investigating Clang 21 incompatibilities with the Xcode linker.
          mamba install -y \
            "compilers=1.11.0" \
            "c-compiler=1.11.0" \
            "cxx-compiler=1.11.0" \
            "clang=19.1.7" \
            "clangxx=19.1.7" \
            cmake \
            make \
            git \
            glib \
            libxml2 \
            libxmlpp-4.0 \
            liblapack \
            pkg-config \
            coincbc \
            boost-cpp \
            hdf5 \
            sqlite \
            pcre \
            setuptools \
            pytest \
            pytables \
            pandas \
            jinja2 \
            "cython<3.1.0" \
            websockets \
            pprintpp \
            pip
          export CC=$CONDA_PREFIX/bin/clang
          export CXX=$CONDA_PREFIX/bin/clang++
          export CPP=$CONDA_PREFIX/bin/clang-cpp

          # Find Conda's transitive library dependencies without relying on OpenMP.
          export LDFLAGS="${LDFLAGS:+$LDFLAGS }-L${CONDA_PREFIX}/lib"
          mkdir -p $(python3 -m site --user-site)
          python3 install.py -j 3 ${{ matrix.parallel_flag }} ${{ matrix.coin_flag }}
          export PATH=$HOME/.local/bin:$PATH
          cyclus_unit_tests
          cd tests && python3 -m pytest
