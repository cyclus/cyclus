name: MacOS Build/Test Cyclus

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"
  push:
    paths-ignore:
      - ".github/workflows/build_test.yml"
      - ".github/workflows/publish_latest.yml"
      - ".github/workflows/publish_release.yml"
      - ".github/workflows/changelog_test.yml"
      - ".github/workflows/code_coverage.yml"
      - ".github/workflows/rocky_build_test.yml"
      - "doc/**"
      - "CHANGELOG.rst"

# Cancel an in-progress run when a newer commit is pushed to the same branch
# or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pixi:
    strategy:
      fail-fast: false
      matrix:
        macos_versions: [
            macos-15-intel,
            macos-latest, # arm64
        ]
        parallel_flag : [
          "",
          "--parallel",
        ]
        coin_flag : [
          "",
          "--allow-milps",
        ]

    runs-on: ["${{ matrix.macos_versions }}"]

    steps:
      - name: Checkout Cyclus
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          environments: test
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Build Cyclus
        run: pixi run -e test build -j "$(sysctl -n hw.logicalcpu)" ${{ matrix.parallel_flag }} ${{ matrix.coin_flag }}

      - name: Run unit tests
        run: pixi run -e test test-unit

      - name: Run Python tests
        run: pixi run -e test test-python
